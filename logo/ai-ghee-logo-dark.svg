<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd472"/><stop offset="1" stop-color="#cf8a1c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#413021"/><stop offset="1" stop-color="#1a120a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#ground)"/>
  <circle cx="400" cy="400" r="356" fill="none" stroke="#c08a2e" stroke-width="9" opacity="0.5"/>

  <!-- the wooden spine, drawn first so the drill sits in front of it -->
  <rect x="454" y="182" width="78" height="338" rx="14" fill="#b57f22"/>

  <!-- drill body, angled, reaching across to the spine so the two read as one machine -->
  <g transform="rotate(-15 350 262)">
    <rect x="214" y="214" width="290" height="100" rx="32" fill="#f2bc52"/>
    <rect x="188" y="234" width="42" height="60" rx="16" fill="#f2bc52"/>
  </g>

  <!-- the clamp holding the drill to the spine -->
  <rect x="424" y="228" width="128" height="46" rx="14" fill="#7c5312" transform="rotate(-15 488 251)"/>

  <!-- emergency stop, sitting on the face of the spine -->
  <circle cx="493" cy="360" r="52" fill="#8f2a15"/>
  <circle cx="493" cy="354" r="46" fill="#e04b2f"/>

  <!-- chuck and the shaft running down into the pot -->
  <rect x="336" y="300" width="64" height="56" rx="12" fill="#f2bc52" transform="rotate(-15 368 328)"/>
  <rect x="336" y="348" width="34" height="172" rx="10" fill="#f2bc52"/>

  <!-- pot handles -->
  <path d="M250 516 q-52 4 -52 42 q0 24 26 28" fill="none" stroke="#f2bc52" stroke-width="26" stroke-linecap="round"/>
  <path d="M550 516 q52 4 52 42 q0 24 -26 28" fill="none" stroke="#f2bc52" stroke-width="26" stroke-linecap="round"/>

  <!-- pot -->
  <path d="M248 508 h304 l-26 130 a40 40 0 0 1 -40 34 h-172 a40 40 0 0 1 -40 -34 z" fill="url(#pot)"/>
  <ellipse cx="400" cy="508" rx="164" ry="32" fill="#ffe4a6"/>

  <!-- the churn head, sunk in the ghee -->
  <g fill="#5a3d11">
    <rect x="300" y="494" width="140" height="28" rx="11"/>
    <rect x="336" y="470" width="34" height="76" rx="11"/>
  </g>
</svg>