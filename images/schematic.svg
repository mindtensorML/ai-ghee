<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 812" role="img" aria-label="Wiring of the ghee rig. A Raspberry Pi drives a BTS7960 H-bridge over four signal wires and reads an INA260 current sensor over I2C. A 12 volt supply, a 15 amp fuse, the emergency stop button and the sensor sit in series in the motor loop, which the Pi never touches."><rect width="1060" height="812" fill="#f4ead7"/><style>
 .grid{stroke:#e3d2b4;stroke-width:0.70;opacity:.45}
 .box{fill:#fff8ec;stroke:#2a2118;stroke-width:2.00}
 .chip{fill:#fff8ec;stroke:#a8681a;stroke-width:1.70}
 .sig{fill:none;stroke:#2a2118;stroke-width:1.90;stroke-linecap:round;stroke-linejoin:round}
 .pwr{fill:none;stroke:#c08a2e;stroke-width:6.20;stroke-linecap:round;stroke-linejoin:round}
 .pwrk{fill:none;stroke:#a8681a;stroke-width:6.20;stroke-linecap:round;stroke-linejoin:round}
 .ttl{font:700 13.0px "Avenir Next","Segoe UI",sans-serif;fill:#2a2118;letter-spacing:0.16em}
 .nm{font:700 12.0px "Avenir Next","Segoe UI",sans-serif;fill:#2a2118;letter-spacing:0.10em}
 .sub{font:400 10.0px "Avenir Next","Segoe UI",sans-serif;fill:#9a836a;letter-spacing:0.05em}
 .pin{font:600 10.5px "Avenir Next","Segoe UI",sans-serif;fill:#a8681a;letter-spacing:0.04em}
 .val{font:600 10.5px "Avenir Next","Segoe UI",sans-serif;fill:#2a2118}
 .note{font:italic 400 11.0px Georgia,serif;fill:#9a836a}
 .notek{font:italic 400 11.0px Georgia,serif;fill:#a8681a}
 .lead{fill:none;stroke:#9a836a;stroke-width:0.90;stroke-dasharray:2.5 2.5}
 .red{fill:none;stroke:#b0402c;stroke-width:6.20;stroke-linecap:round}
</style><g><line class="grid" x1="26" y1="0" x2="26" y2="812"/><line class="grid" x1="52" y1="0" x2="52" y2="812"/><line class="grid" x1="78" y1="0" x2="78" y2="812"/><line class="grid" x1="104" y1="0" x2="104" y2="812"/><line class="grid" x1="130" y1="0" x2="130" y2="812"/><line class="grid" x1="156" y1="0" x2="156" y2="812"/><line class="grid" x1="182" y1="0" x2="182" y2="812"/><line class="grid" x1="208" y1="0" x2="208" y2="812"/><line class="grid" x1="234" y1="0" x2="234" y2="812"/><line class="grid" x1="260" y1="0" x2="260" y2="812"/><line class="grid" x1="286" y1="0" x2="286" y2="812"/><line class="grid" x1="312" y1="0" x2="312" y2="812"/><line class="grid" x1="338" y1="0" x2="338" y2="812"/><line class="grid" x1="364" y1="0" x2="364" y2="812"/><line class="grid" x1="390" y1="0" x2="390" y2="812"/><line class="grid" x1="416" y1="0" x2="416" y2="812"/><line class="grid" x1="442" y1="0" x2="442" y2="812"/><line class="grid" x1="468" y1="0" x2="468" y2="812"/><line class="grid" x1="494" y1="0" x2="494" y2="812"/><line class="grid" x1="520" y1="0" x2="520" y2="812"/><line class="grid" x1="546" y1="0" x2="546" y2="812"/><line class="grid" x1="572" y1="0" x2="572" y2="812"/><line class="grid" x1="598" y1="0" x2="598" y2="812"/><line class="grid" x1="624" y1="0" x2="624" y2="812"/><line class="grid" x1="650" y1="0" x2="650" y2="812"/><line class="grid" x1="676" y1="0" x2="676" y2="812"/><line class="grid" x1="702" y1="0" x2="702" y2="812"/><line class="grid" x1="728" y1="0" x2="728" y2="812"/><line class="grid" x1="754" y1="0" x2="754" y2="812"/><line class="grid" x1="780" y1="0" x2="780" y2="812"/><line class="grid" x1="806" y1="0" x2="806" y2="812"/><line class="grid" x1="832" y1="0" x2="832" y2="812"/><line class="grid" x1="858" y1="0" x2="858" y2="812"/><line class="grid" x1="884" y1="0" x2="884" y2="812"/><line class="grid" x1="910" y1="0" x2="910" y2="812"/><line class="grid" x1="936" y1="0" x2="936" y2="812"/><line class="grid" x1="962" y1="0" x2="962" y2="812"/><line class="grid" x1="988" y1="0" x2="988" y2="812"/><line class="grid" x1="1014" y1="0" x2="1014" y2="812"/><line class="grid" x1="1040" y1="0" x2="1040" y2="812"/><line class="grid" x1="0" y1="26" x2="1060" y2="26"/><line class="grid" x1="0" y1="52" x2="1060" y2="52"/><line class="grid" x1="0" y1="78" x2="1060" y2="78"/><line class="grid" x1="0" y1="104" x2="1060" y2="104"/><line class="grid" x1="0" y1="130" x2="1060" y2="130"/><line class="grid" x1="0" y1="156" x2="1060" y2="156"/><line class="grid" x1="0" y1="182" x2="1060" y2="182"/><line class="grid" x1="0" y1="208" x2="1060" y2="208"/><line class="grid" x1="0" y1="234" x2="1060" y2="234"/><line class="grid" x1="0" y1="260" x2="1060" y2="260"/><line class="grid" x1="0" y1="286" x2="1060" y2="286"/><line class="grid" x1="0" y1="312" x2="1060" y2="312"/><line class="grid" x1="0" y1="338" x2="1060" y2="338"/><line class="grid" x1="0" y1="364" x2="1060" y2="364"/><line class="grid" x1="0" y1="390" x2="1060" y2="390"/><line class="grid" x1="0" y1="416" x2="1060" y2="416"/><line class="grid" x1="0" y1="442" x2="1060" y2="442"/><line class="grid" x1="0" y1="468" x2="1060" y2="468"/><line class="grid" x1="0" y1="494" x2="1060" y2="494"/><line class="grid" x1="0" y1="520" x2="1060" y2="520"/><line class="grid" x1="0" y1="546" x2="1060" y2="546"/><line class="grid" x1="0" y1="572" x2="1060" y2="572"/><line class="grid" x1="0" y1="598" x2="1060" y2="598"/><line class="grid" x1="0" y1="624" x2="1060" y2="624"/><line class="grid" x1="0" y1="650" x2="1060" y2="650"/><line class="grid" x1="0" y1="676" x2="1060" y2="676"/><line class="grid" x1="0" y1="702" x2="1060" y2="702"/><line class="grid" x1="0" y1="728" x2="1060" y2="728"/><line class="grid" x1="0" y1="754" x2="1060" y2="754"/><line class="grid" x1="0" y1="780" x2="1060" y2="780"/><line class="grid" x1="0" y1="806" x2="1060" y2="806"/></g><rect class="box" x="62" y="92" width="208" height="206" rx="6"/><text class="nm" x="75" y="116">RASPBERRY PI 3</text><text class="sub" x="75" y="133">gpiozero, 50 Hz control loop</text><rect class="box" x="596" y="92" width="226" height="206" rx="6"/><text class="nm" x="609" y="116">BTS7960 H-BRIDGE</text><text class="sub" x="609" y="133">two half bridges, 12 V motor side</text><line class="sig" x1="270" y1="132" x2="596" y2="132"/><circle cx="270" cy="132" r="3.4" fill="#2a2118"/><circle cx="596" cy="132" r="3.4" fill="#2a2118"/><text class="pin" x="282" y="124">GPIO 18</text><text class="pin" x="584" y="124" text-anchor="end">RPWM</text><text class="sub" x="433.0" y="148" text-anchor="middle">1 kHz</text><line class="sig" x1="270" y1="172" x2="596" y2="172"/><circle cx="270" cy="172" r="3.4" fill="#2a2118"/><circle cx="596" cy="172" r="3.4" fill="#2a2118"/><text class="pin" x="282" y="164">GPIO 19</text><text class="pin" x="584" y="164" text-anchor="end">LPWM</text><text class="sub" x="433.0" y="188" text-anchor="middle">1 kHz</text><line class="sig" x1="270" y1="212" x2="596" y2="212"/><circle cx="270" cy="212" r="3.4" fill="#2a2118"/><circle cx="596" cy="212" r="3.4" fill="#2a2118"/><text class="pin" x="282" y="204">GPIO 23</text><text class="pin" x="584" y="204" text-anchor="end">R_EN</text><text class="sub" x="433.0" y="228" text-anchor="middle">held high</text><line class="sig" x1="270" y1="252" x2="596" y2="252"/><circle cx="270" cy="252" r="3.4" fill="#2a2118"/><circle cx="596" cy="252" r="3.4" fill="#2a2118"/><text class="pin" x="282" y="244">GPIO 24</text><text class="pin" x="584" y="244" text-anchor="end">L_EN</text><text class="sub" x="433.0" y="268" text-anchor="middle">held high</text><circle cx="930" cy="195" r="52" fill="#fff8ec" stroke="#c08a2e" stroke-width="6.20"/><text class="nm" x="930" y="200.0" text-anchor="middle">M</text><line class="pwr" x1="822" y1="175" x2="882" y2="175"/><line class="pwr" x1="822" y1="215" x2="882" y2="215"/><text class="pin" x="832" y="168">M+</text><text class="pin" x="832" y="236">M&#8722;</text><text class="sub" x="930" y="272" text-anchor="middle">CORDLESS DRILL</text><path class="sig" d="M200,298 L200,392 L520,392 L520,482"/><path class="sig" d="M232,298 L232,368 L556,368 L556,482"/><circle cx="200" cy="298" r="3.4" fill="#2a2118"/><circle cx="232" cy="298" r="3.4" fill="#2a2118"/><text class="pin" x="192" y="322" text-anchor="end">GPIO 2 &#183; 3</text><text class="sub" x="192" y="340" text-anchor="end">I2C BUS 1</text><text class="pin" x="528" y="440">SDA</text><text class="pin" x="564" y="418">SCL</text><rect class="chip" x="476" y="482" width="200" height="78" rx="6"/><text class="nm" x="489" y="506">INA260</text><text class="sub" x="489" y="523">0x40 &#183; 1.25 mA a bit</text><text class="pin" x="466" y="509" text-anchor="end">IN+</text><text class="pin" x="686" y="509">IN&#8722;</text><rect class="box" x="62" y="560" width="152" height="74" rx="5"/><text class="nm" x="74" y="584">12 V SUPPLY</text><text class="sub" x="74" y="601">switch mode, off the wall</text><line x1="198" y1="570" x2="198" y2="624" stroke="#e3d2b4" stroke-width="1.40"/><line x1="189" y1="570" x2="189" y2="624" stroke="#e3d2b4" stroke-width="1.40"/><line x1="180" y1="570" x2="180" y2="624" stroke="#e3d2b4" stroke-width="1.40"/><line x1="171" y1="570" x2="171" y2="624" stroke="#e3d2b4" stroke-width="1.40"/><line class="sig" x1="26.0" y1="597.0" x2="62" y2="597.0"/><text class="sub" x="44.0" y="589.0" text-anchor="middle">MAINS</text><text class="val" x="224" y="572">+</text><text class="val" x="224" y="634">&#8722;</text><path class="pwr" d="M214,580 L246,580 L246,520 L376,520"/><path class="pwr" d="M424,520 L476,520"/><path class="pwr" d="M676,520 L716,520 L716,298"/><path class="pwr" d="M800,298 L800,706 L246,706 L246,616 L214,616"/><text class="pin" x="706" y="320" text-anchor="end">B+</text><text class="pin" x="810" y="320">B&#8722;</text><rect x="293.0" y="512.0" width="34.0" height="16.0" rx="3.0" fill="#fff8ec" stroke="#a8681a" stroke-width="1.80"/><line x1="293.0" y1="520" x2="327.0" y2="520" stroke="#a8681a" stroke-width="1.60"/><text class="val" x="310" y="500" text-anchor="middle">15 A</text><line class="red" x1="360.0" y1="520" x2="376.0" y2="520"/><line class="red" x1="424.0" y1="520" x2="440.0" y2="520"/><line x1="376.0" y1="520" x2="413.0" y2="501.0" stroke="#b0402c" stroke-width="3.00" stroke-linecap="round"/><line x1="395.0" y1="509.0" x2="395.0" y2="487.0" stroke="#b0402c" stroke-width="2.60"/><rect x="376.0" y="474.0" width="38.0" height="13.0" rx="6.5" fill="#b0402c"/><circle cx="376.0" cy="520" r="3.6" fill="#b0402c"/><circle cx="424.0" cy="520" r="3.6" fill="#b0402c"/><text class="pin" x="400" y="462" text-anchor="middle">EMERGENCY STOP</text><text class="note" x="272" y="326" text-anchor="start">Four wires, and not one of them carries the motor.</text><text class="note" x="272" y="341" text-anchor="start">The Pi says how hard and which way. It never</text><text class="note" x="272" y="356" text-anchor="start">touches the current it is asking for.</text><text class="note" x="834" y="336" text-anchor="start">Only one PWM is ever above</text><text class="note" x="834" y="351" text-anchor="start">zero, and every reversal passes</text><text class="note" x="834" y="366" text-anchor="start">through zero on the way, so the</text><text class="note" x="834" y="381" text-anchor="start">two halves can never both be on.</text><text class="note" x="834" y="500" text-anchor="start">Read once a second. Its logic</text><text class="note" x="834" y="515" text-anchor="start">side runs off the Pi, so it still</text><text class="note" x="834" y="530" text-anchor="start">answers with the supply off.</text><text class="notek" x="452" y="574" text-anchor="middle">Nothing runs from this button to the Pi. It breaks the loop</text><text class="notek" x="452" y="589" text-anchor="middle">itself. The rig works out that it is open by asking for 30 per</text><text class="notek" x="452" y="604" text-anchor="middle">cent and getting less than 200 mA back.</text><path class="lead" d="M400,536 L400,554 L452,554"/><text class="note" x="596" y="58" text-anchor="start">8 A held for three seconds and the software lets go.</text><text class="note" x="596" y="73" text-anchor="start">The fuse is for everything software cannot catch.</text><line class="sig" x1="66" y1="52" x2="106" y2="52"/><text class="sub" x="114" y="56">SIGNAL, MILLIAMPS</text><line class="pwr" x1="66" y1="74" x2="106" y2="74"/><text class="sub" x="114" y="78">MOTOR LOOP, AMPS</text><rect x="798" y="724" width="200" height="62" rx="4" fill="none" stroke="#9a836a" stroke-width="1"/><line x1="798" y1="750" x2="998" y2="750" stroke="#9a836a" stroke-width="1"/><text class="ttl" x="809" y="742">THE BEAST</text><text class="sub" x="809" y="766">POWER AND SENSE</text><text class="sub" x="809" y="780">READ FROM THE RIG</text></svg>