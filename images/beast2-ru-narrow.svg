<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1020" role="img" aria-label="Предварительная схема планируемой второй машины для гхи, которая ещё не собрана. Raspberry Pi читает камеру OV5647 по CSI, USB-микрофон и датчик температуры DS18B20 на GPIO 4. Два тонких провода от Pi переключают IoT-реле на сетевой линии, а измеритель мощности PZEM-004T отчитывается обратно на Pi по USB. Реле питает измеритель, а измеритель питает миксер KitchenAid мощностью 690 W."><rect width="460" height="1020" fill="#f4ead7"/><style>
