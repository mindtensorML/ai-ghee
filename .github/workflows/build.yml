name: Build pages from markdown

# Runs whenever the source of the site changes. The generated index.html and
# beast.html are deliberately not in the trigger list, so the commit this
# workflow makes cannot set the workflow off again.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "build.py"
      - "template.tpl"
      - "style.css"
      - "images/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python3 build.py

      - name: Commit the rebuilt pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # build.py rewrites these two on every run, so they have to be
          # staged with the pages. Staging only the HTML meant a language
          # added through github.com would publish its pages and leave the
          # sitemap behind, with nothing to say so.
          git add -- '*.html' sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "Pages already match the markdown, nothing to commit."
          else
            git commit -m "Rebuild pages from markdown"
            git push
          fi
